name: Validate site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:syntax
      - run: npm test
      - run: npm run validate:data
      - run: npm run generate:site
      - run: git diff --exit-code
      - run: npm run validate:site
      - run: npm run validate:growth
